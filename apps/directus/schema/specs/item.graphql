input create_amtsblattmeldungen_input {
  id: ID

  """
  Die Identitaet beim Portal. Unique — die Klammer, die einen zweiten Lauf idempotent macht.
  """
  publikations_id: String!

  """Amtliche Meldungsnummer, z.B. BP-BL05-0000006880."""
  publikationsnummer: String

  """Kantonskuerzel der Publikation."""
  kanton: String

  """
  Wonach die Redaktion sortiert. "personen" ist keine Themen-, sondern eine Eigenschaft: dort werden Privatpersonen genannt.
  """
  gruppe: String
  rubrik: String
  unterrubrik: String

  """Deutscher Name aus dem Rubrikkatalog des Portals."""
  rubrik_name: String
  titel: String
  publiziert_am: Date

  """
  Einsprache- oder Auflagefrist. Die Zahl, die eine Meldung dringend macht — sie gehoert in den Lead.
  """
  frist: Date

  """Publizierende Stelle."""
  amt: String

  """Das amtliche PDF. Vom Code gebaut, nie vom Modell geschrieben."""
  pdf_url: String

  """
  Die beschrifteten Angaben aus der Einzelpublikation. Erst gefuellt, wenn jemand die Zeile anfasst.
  """
  angaben: JSON

  """
  Worauf die Publikation verweist — Plaene, Akten, Karten. "lesbar" sagt, ob wir sie maschinell lesen koennen.
  """
  unterlagen: JSON

  """
  Natuerliche Personen, welche die Publikation nennt. Sie gehen an den Prompt als "nicht nennen" und an die Pruefung.
  """
  personen: JSON

  """
  Was aus den aufgelegten Plaenen hervorgeht, je Befund mit dem Blatt, auf dem er steht.
  """
  planbefunde: JSON
  plan_status: String
  plan_fazit: String

  """
  Urteil der Sichtung: lohnt sich ein Blick? Leer heisst "noch nicht beurteilt" — nicht "nein".
  """
  vorschlag: Boolean
  vorschlag_begruendung: String
  entscheid: String
  ablehnungsgrund: String
  ablehnungskommentar: String
  date_created: Date
  date_updated: Date
  gemeinde: create_gemeinden_input
  meldungen: [create_meldungen_input]
}

input create_ankuendigungen_input {
  id: ID
  quelle: create_quellen_input

  """
  Normalisierter Titel. Haelt einen Eintrag ueber den Wechsel von angekuendigt zu publiziert zusammen.
  """
  schluessel: String

  """
  Kann von Hand erfasst werden, wenn die Agenda-Abfrage abgewiesen wurde.
  """
  titel: String!
  status: String

  """Publikationsdatum laut Agenda. Leer, solange nur angekuendigt."""
  datum: Date
  quartal: String
  link: String
  datensatz: create_datensaetze_input
  erstmals_gesehen: Date

  """Wann der Eintrag von angekuendigt auf publiziert gewechselt ist."""
  publiziert_seit: Date
  date_created: Date
  date_updated: Date

  """
  Wann zuletzt nach dem passenden Datensatz gesucht wurde. Leeren, um erneut suchen zu lassen.
  """
  zuordnung_geprueft: Date

  """Warum dieser Datensatz zugeordnet wurde — oder warum keiner passt."""
  zuordnung_hinweis: String

  """
  Wann dem Link dieses Eintrags zuletzt gefolgt wurde. Leeren, um es erneut zu versuchen.
  """
  link_geprueft: Date
}

input create_chat_nachrichten_input {
  id: ID
  lauf: create_laeufe_input
  meldung: create_meldungen_input
  rolle: String!
  inhalt: String!

  """Reihenfolge innerhalb des Gespraechs."""
  position: Int!
  date_created: Date
}

input create_datensaetze_input {
  id: ID
  quelle: create_quellen_input

  """Id des Datensatzes im Portal."""
  externe_id: String!
  titel: String!
  beschreibung: String

  """
  Zeitstempel des Portals. Aendert sich auch bei reinen Metadaten-Korrekturen.
  """
  portal_modified: Date

  """Feldliste des Portals."""
  felder: JSON

  """Aus den Feld-Metadaten des Portals erkannt, nicht geraten."""
  hat_gemeinde: Boolean!

  """
  Fingerabdruck des Inhalts. Erst eine Aenderung hier eroeffnet einen Lauf.
  """
  letzter_stand: String
  status: String

  """
  Einschaetzung der Redaktions-KI, warum der Datensatz relevant ist oder nicht.
  """
  bewertung: String
  date_created: Date
  date_updated: Date

  """
  Nur setzen, wenn die Gemeindespalte nicht automatisch erkannt wird. Exakter Feldname im Portal.
  """
  gemeindefeld: String

  """
  Auftrag, den jeder neue Lauf zu diesem Datensatz erbt — auch der naechstes Jahr.
  """
  standard_vorgabe: String

  """
  Stand, fuer den zuletzt ein Lauf eroeffnet wurde. Leeren, um erneut einen Lauf zu erzwingen.
  """
  lauf_stand: String

  """
  Wann die Gemeindespalte gegen echte Werte geprueft wurde. Leeren, um erneut zu pruefen.
  """
  gemeinde_geprueft: Date

  """Aktualisierungsrhythmus laut Katalog: annual, daily, irregular …"""
  rhythmus: String

  """
  Wann sich die Daten selbst zuletzt geaendert haben — nicht die Beschreibung.
  """
  daten_stand: Date

  """Zeilen im Portal."""
  zeilen: Int
  ankuendigung: create_ankuendigungen_input
}

