name: Publish docker image

# Reusable builder: builds the Docker image from a given app subfolder and
# pushes it to GHCR under the supplied tags. Called by the per-app main
# workflows and the shared production workflow.

on:
  workflow_call:
    inputs:
      context:
        description: Build context / app subfolder (e.g. apps/directus)
        required: true
        type: string
      tags:
        description: Newline-separated list of image tags to push
        required: true
        type: string

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: |
            ${{ inputs.tags }}
