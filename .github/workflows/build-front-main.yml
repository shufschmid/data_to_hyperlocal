name: Publish frontend main image

# Path-filtered: only rebuilds the Next frontend image when something under
# apps/front/** changes on main:
#   ghcr.io/<owner>/<repo>-front:main

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/front/**'

jobs:
  date_sha_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image_tag.outputs.tag }}
    steps:
      - id: image_tag
        run: echo "tag=$(date +%s)-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  publish_main_docker:
    needs: date_sha_tag
    uses: ./.github/workflows/publish-docker-image.yml
    with:
      context: apps/front
      tags: |
        ghcr.io/${{ github.repository }}-front:main-${{ needs.date_sha_tag.outputs.tag }}
        ghcr.io/${{ github.repository }}-front:main
    secrets: inherit
