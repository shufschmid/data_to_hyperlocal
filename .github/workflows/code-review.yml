name: Code review

# Reviews the CHANGED code against the architectural rules in
# .github/code-review-rules.yml — the rules the CLAUDE.md files state in prose.
# Findings appear as a comment on the pull request, as an artifact, and in the
# job summary. This complements verify.yml: that one checks that the code works,
# this one checks that it is built the way this repo is meant to be built.
#
# Two things changed on 15 September 2026, and both were measured:
#
#   1. CLAUDE, NOT GEMINI. Hard constraint 2 of the root CLAUDE.md says the
#      Claude API is the only inference provider this project uses. The review
#      was the one place that did not hold to it, because the action it called
#      (wepublish/gha-review@v1) can only speak to Gemini: `gemini-api-key` is
#      declared `required` and the model is hardwired. It now runs the official
#      anthropics/claude-code-action, so there is one provider again and one
#      key to keep alive.
#
#   2. THE DIFF, NOT THE WHOLE TREE. The old run read every reviewed file on
#      every push — measured 2.78 MB of TypeScript and YAML, roughly 700'000
#      input tokens per run, on every pull request AND every push to main (and
#      a push to main is a deploy here, so that is several times a day). A
#      review of the change costs a fraction of that and answers the question
#      anyone actually asks of a pull request. Claude Haiku 4.5 does the
#      reading; the rules file is a checklist, not a puzzle.
#
# WITHOUT `ANTHROPIC_API_KEY` THIS JOB STAYS QUIET AND SAYS SO — it does not
# fail. That is the same bargain as CRAWLER_KEY in the application: a missing
# key switches a feature off, it does not break the build. The old workflow
# failed on a missing secret instead, and had been red on main since at least
# 11 September without once saying anything about the code.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  review:
    name: Architecture rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Required by the action itself, not just by the federation path it
      # documents: without it the run logs `Unable to get
      # ACTIONS_ID_TOKEN_REQUEST_URL` and finishes green having produced no
      # verdict at all. Measured on pull requests #5 and #7.
      id-token: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The review needs the base commit to diff against, so the default
          # single-commit checkout is not enough.
          fetch-depth: 0

      - name: Say why nothing happens
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "### Architekturregeln nicht geprueft" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Das Geheimnis \`ANTHROPIC_API_KEY\` ist auf diesem Repository nicht gesetzt." >> "$GITHUB_STEP_SUMMARY"
          echo "Die Pruefung bleibt still, bis es da ist — sie faellt nicht." >> "$GITHUB_STEP_SUMMARY"

      # The change under review, as two plain files Claude reads. Computed here
      # rather than left to the model: what counts as "the change" is a fact of
      # the event, not a judgement call.
      - name: Collect the change
        if: env.ANTHROPIC_API_KEY != ''
        id: aenderung
        env:
          BASIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          KOPF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A first push to a branch and the very first commit of a repository
          # report an all-zero base; fall back to the parent commit.
          if [ -z "$BASIS" ] || [ "$BASIS" = "0000000000000000000000000000000000000000" ]; then
            BASIS="$(git rev-parse "${KOPF}^" 2>/dev/null || echo '')"
          fi
          if [ -z "$BASIS" ]; then
            echo "leer=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The same exclusions the rules file assumes: generated, dumped and
          # vendored trees are nobody's architecture.
          git diff --name-only "$BASIS" "$KOPF" -- \
            ':(exclude)apps/directus/schema/**' \
            ':(exclude)apps/directus/extensions/.registry/**' \
            ':(exclude)apps/directus/migrations/*.mjs' \
            ':(exclude)apps/front/src/graphql/generated/**' \
            ':(exclude)**/*.dump' \
            ':(exclude)**/*.liquid' \
            ':(exclude)**/package-lock.json' \
            > geaenderte-dateien.txt

          git diff "$BASIS" "$KOPF" -- \
            ':(exclude)apps/directus/schema/**' \
            ':(exclude)apps/directus/extensions/.registry/**' \
            ':(exclude)apps/directus/migrations/*.mjs' \
            ':(exclude)apps/front/src/graphql/generated/**' \
            ':(exclude)**/*.dump' \
            ':(exclude)**/*.liquid' \
            ':(exclude)**/package-lock.json' \
            > aenderung.diff

          if [ ! -s geaenderte-dateien.txt ]; then
            echo "leer=ja" >> "$GITHUB_OUTPUT"
          else
            echo "leer=nein" >> "$GITHUB_OUTPUT"
            echo "Geprueft werden $(wc -l < geaenderte-dateien.txt) Dateien, $(wc -c < aenderung.diff) Bytes Diff."
          fi

      - uses: anthropics/claude-code-action@v1
        if: env.ANTHROPIC_API_KEY != '' && steps.aenderung.outputs.leer == 'nein'
        id: review
        # Keep going so the report is posted and uploaded even when a rule is
        # violated; the last step turns the outcome back into a failure.
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Haiku 4.5 reads a checklist against a diff — that is what this is.
          # The schema is what makes the gate deterministic: the job fails on a
          # parsed field, never on the model's prose.
          claude_args: >-
            --model claude-haiku-4-5
            --json-schema '{"type":"object","additionalProperties":false,
            "required":["bestanden","befunde"],
            "properties":{
            "bestanden":{"type":"boolean"},
            "befunde":{"type":"array","items":{"type":"object",
            "additionalProperties":false,
            "required":["regel","datei","schwere","befund"],
            "properties":{
            "regel":{"type":"string"},
            "datei":{"type":"string"},
            "zeile":{"type":"integer"},
            "schwere":{"type":"string","enum":["error","warning","info"]},
            "befund":{"type":"string"}}}}}}'
          prompt: |
            Du pruefst eine Aenderung an diesem Repository gegen seine
            Architekturregeln. Antworte am Ende im vorgegebenen JSON-Schema.

            SO GEHST DU VOR:

            1. Lies `.github/code-review-rules.yml`. Das sind die Regeln, und
               nur sie. Jede hat eine `id`, einen `title`, eine `description`
               und oft `include`/`exclude`-Globs und eine `severity`.
            2. Lies `geaenderte-dateien.txt` und `aenderung.diff`. Das ist die
               Aenderung.
            3. Pruefe NUR die geaenderten Zeilen. Wenn du fuer ein Urteil mehr
               Zusammenhang brauchst, lies die betroffene Datei ganz — aber
               melde nichts, was die Aenderung nicht angefasst hat. Bestehende
               Verstoesse sind nicht Sache dieses Pull Requests.
            4. Achte auf die Globs: eine Regel mit `include` gilt nur fuer
               Dateien, auf die ihr Muster passt.

            WAS EIN BEFUND IST:

            - Ein Befund nennt IMMER die `id` der verletzten Regel, die Datei
              und die Zeile, und sagt in einem Satz, was konkret dagegen
              verstoesst. Kein Befund ohne Regel.
            - `schwere` uebernimmst du aus der `severity` der Regel (fehlt
              sie, ist es `error`).
            - `bestanden` ist genau dann false, wenn mindestens ein Befund die
              Schwere `error` hat. Warnungen und Hinweise allein bestehen.
            - Im Zweifel meldest du nichts. Ein falscher Befund kostet die
              Redaktion mehr Zeit als ein uebersehener: nach drei unnoetigen
              Warnungen liest niemand mehr hin. Melde nur, was du an einer
              konkreten Zeile zeigen kannst.
            - Das hier ist ARCHITEKTUR, nicht Stil. Prettier und
              `tsc --noEmit` pruefen Formatierung und Typen schon; was die
              beiden koennen, gehoert nicht hierher.

            Schreibe KEINE Datei und keinen Bericht. Deine Antwort ist das
            JSON. Was die Redaktorin am Pull Request liest, baut der Workflow
            daraus — gebaut, nicht geschrieben, wie die Quellenzeile im
            Projekt selbst.

            ZUM PROJEKT (Stand halten mit dem Kopf von
            `.github/code-review-rules.yml`):

            Ein Monorepo aus zwei unabhaengig installierten und deployten
            Apps — KEIN npm-Workspace, jede App hat ihre eigene package.json
            und ihre eigene Sperrdatei.

            `apps/directus` ist ein Directus-11-Backend auf Postgres 16. Es
            besitzt das Datenmodell UND die gesamte serverseitige Logik; es
            gibt keinen separaten API-Dienst. Die Logik liegt in einem
            Erweiterungsbuendel unter `apps/directus/extensions/app` mit
            `endpoints/`, `hooks/`, `operations/` und `shared/` (claude.ts,
            env.ts, http.ts). Geplante Arbeit ist ein Directus-Flow mit
            Cron-Ausloeser, der eine Operation aufruft. Das Datenmodell liegt
            versioniert in `apps/directus/schema` (directus-sync): es wird in
            der Admin-UI gebaut und mit `npm run schema:dump` committet.
            `apps/directus/migrations/*.mts` ist der Notausgang fuer
            Zeilendaten und aendert nie Struktur.

            `apps/front` ist Next 16 (App Router), React 19, MUI 9, Apollo
            Client 4 — und nur Oberflaeche. Der Browser haelt kein Token: er
            bekommt zwei httpOnly-Sitzungscookies, und jede Anfrage an
            Directus laeuft ueber einen Route-Handler unter `src/app/api`,
            der mit dem Zugriffstoken der angemeldeten Person weiterleitet.

            Jeder Modellaufruf geht an die Claude-API, ueber
            `apps/directus/extensions/app/src/shared/claude.ts`. Der
            `ANTHROPIC_API_KEY` lebt nur im Backend.

            Oberflaechentexte sind Deutsch — auch Fehlermeldungen, die den
            Browser erreichen. Code, Kommentare und Logs sind Englisch.
            Ueberall TypeScript, strict mit `noUncheckedIndexedAccess`.
            Prettier und tsc sind das Stil- und Typentor; ESLint gibt es
            nicht.

            Die Anwendung ist «Die Redaktion»: sie beobachtet oeffentliche
            Quellen (data.bl.ch, die Agenda des Statistischen Amts,
            statistik.bl.ch, Amtsblatt, Wochenblaetter, Gemeindeseiten,
            Sportresultate, zwei Sendungen) und schreibt je Gemeinde einen
            Beitrag, den eine Redaktorin freigibt. Jede Zahl in einem Entwurf
            wird gegen die Daten geprueft, aus denen sie stammt; Prompts
            stehen neben ihren Pruefungen (`redaktion/prompt.ts`,
            `redaktion/spielbericht.ts`, `redaktion/warnungen.ts`).

      - name: Say that nothing changed
        if: env.ANTHROPIC_API_KEY != '' && steps.aenderung.outputs.leer == 'ja'
        run: |
          echo "### Architekturregeln: nichts zu pruefen" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Die Aenderung beruehrt keine Datei, fuer die diese Regeln gelten." >> "$GITHUB_STEP_SUMMARY"

      # The report is BUILT from the parsed answer, not written by the model.
      #
      # It used to ask for a `code-review-report.md`, and the first real run
      # (pull request #5, 15 September 2026) showed what that is worth: the
      # review judged correctly — `bestanden: true`, the gate stayed shut — and
      # produced no file at all, so there was no artifact and no comment. With
      # `--json-schema` the structured answer IS the answer; a file alongside it
      # is a second deliverable nobody guaranteed.
      #
      # So the same rule applies here as to an article's source line: what a
      # reader sees is derived from the data, by code. The model fills in
      # `regel`, `datei`, `zeile` and `befund`; the shape around them is ours,
      # identical on every run, and it cannot go missing.
      - name: Build the report
        if: steps.review.outcome != 'skipped'
        id: bericht
        env:
          ERGEBNIS: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail
          if [ -z "${ERGEBNIS:-}" ]; then
            echo "Der Lauf hat keine strukturierte Antwort geliefert." > code-review-report.md
            echo "befunde=unbekannt" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$ERGEBNIS" | jq -r '
              (.befunde // []) as $b
              | "## Architekturregeln\n"
              + (if (.bestanden != false) and ($b | length) == 0
                   then "\nDie Aenderung haelt die Regeln ein.\n"
                 elif (.bestanden != false)
                   then "\n\($b | length) Hinweis(e), kein Verstoss.\n"
                   else "\n**\($b | length) Befund(e).** Mindestens einer wiegt schwer genug, um den Lauf rot zu machen.\n"
                 end)
              + ([$b[] | "\n### `\(.regel)` — `\(.datei)`\(if .zeile then ":\(.zeile)" else "" end)\n\nSchwere: **\(.schwere)**\n\n\(.befund)\n"] | add // "")
            ' > code-review-report.md
            echo "befunde=$(printf '%s' "$ERGEBNIS" | jq -r '(.befunde // []) | length')" >> "$GITHUB_OUTPUT"
          fi
          cat code-review-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review-report
          path: code-review-report.md
          if-no-files-found: ignore

      # Only when there is something to say, and as ONE comment that gets
      # rewritten: a fresh "keine Befunde" under every push is noise, and noise
      # is how a review stops being read.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && steps.bericht.outcome == 'success' && steps.bericht.outputs.befunde != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body-file code-review-report.md --edit-last --create-if-none

      # The gate, and it reads a parsed field rather than prose: `bestanden`
      # comes back through the schema above.
      #
      # A review that RAN and produced no verdict fails too, and that is the
      # lesson of the first two runs: the gate used to fall back to
      # `{"bestanden":true}` whenever `structured_output` was empty, so a
      # broken review was indistinguishable from a clean one — twice it
      # reported green while judging nothing. A missing key or an untouched
      # tree still pass quietly (the step is skipped); a review that spoke and
      # said nothing is a defect and says so.
      - name: Fail on violations
        if: steps.review.outcome != 'skipped' && fromJSON(steps.review.outputs.structured_output || '{"bestanden":false}').bestanden != true
        env:
          ERGEBNIS: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "${ERGEBNIS:-}" ]; then
            echo "Die Pruefung lief, lieferte aber kein Urteil — kein strukturiertes Ergebnis."
            echo "Das ist ein Defekt der Pruefung, kein Befund am Code. Siehe das Protokoll des Schritts oben."
          else
            echo "Die Aenderung verletzt mindestens eine Architekturregel. Die Befunde stehen in der Zusammenfassung, im Artefakt und im Kommentar."
          fi
          exit 1
