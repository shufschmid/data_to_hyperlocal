name: Verify

# Typecheck, test and build both apps. Runs on every push and pull request — this is
# the gate that keeps `main` deployable.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Directus extensions + migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/directus/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/directus
      # Compiles the migrations and every extension bundle. A bundle that does not
      # build means Directus would refuse to start.
      - run: npm run build
        working-directory: apps/directus
      - run: npm run typecheck
        working-directory: apps/directus
      - run: npm test
        working-directory: apps/directus

  front:
    name: Frontend (Next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/front/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/front
      - run: npm run typecheck
        working-directory: apps/front
      - run: npm test
        working-directory: apps/front
      - run: npm run build
        working-directory: apps/front

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier . --check --ignore-unknown
